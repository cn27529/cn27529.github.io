<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>經典復古太空射擊遊戲 - Galaga Style (無限平行加寬版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei", sans-serif;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      font-size: 2.5rem;
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366, 0 0 20px #ff0055;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    #overlay p {
      font-size: 1.1rem;
      color: #00ffff;
      margin-bottom: 25px;
      line-height: 1.7;
    }

    #startBtn {
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #000;
      background: #00ffff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffff;
      transition: all 0.2s ease;
    }

    #startBtn:hover {
      background: #ffffff;
      box-shadow: 0 0 25px #ffffff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <h1 id="overlayTitle">小蜜蜂 GALAGA</h1>
    <p id="overlayDesc">
      按住 [ ← ][ → ] 或 [ A ][ D ] 移動<br>
      手機裝置可直接按住螢幕拖曳<br><br>
      <span style="color:#00e5ff">🔷 平行加寬彈</span><br>
      <span style="color:#ffff00">⚡ 扇形散射彈</span><br>
      <span style="color:#00ff88">🛡️ 護盾防護</span>
    </p>
    <button id="startBtn">開始遊戲</button>
  </div>

  <script>
    const CONFIG = {
      INITIAL_LIVES: 5,        
      PLAYER_SPEED: 7,         
      AUTO_FIRE_RATE: 110,     // 稍微提高連發手感
      BULLET_SPEED: 11,        

      ENEMY_BASE_SPEED: 2,     
      ENEMY_DIVE_SPEED: 3.5,   
      ENEMY_FIRE_CHANCE: 0.008,

      EMOJIS: {
        BOSS: '🐟',// 👾  🐙  🦞  🦠  🍔  🐟
        BOSS_SIZE: '128px sans-serif',
        ENEMY_RED: '🦀',
        ENEMY_GREEN: '🪲',
        SHIELD_ITEM: '🛡️',
        WEAPON_SPREAD: '⚡',
        WEAPON_WIDE: '🔷',
        LIVES_ICON: '❤️'
      }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');

    let width = 0;
    let height = 0;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      if (player) {
        player.y = height - 70;
      }
    }
    window.addEventListener('resize', resizeCanvas);

    const keys = { left: false, right: false };
    let gameState = 'START';
    let score = 0;
    let lives = CONFIG.INITIAL_LIVES;
    let wave = 1;
    let lastShootTime = 0;
    let touchX = null;

    let player;
    let stars = [];
    let playerBullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];

    class Star {
      constructor() {
        this.reset();
        this.y = Math.random() * height;
      }
      reset() {
        this.x = Math.random() * width;
        this.y = 0;
        this.size = Math.random() * 2 + 0.5;
        this.speed = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random() * 0.8 + 0.2;
      }
      update() {
        this.y += this.speed;
        if (this.y > height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Player {
      constructor() {
        this.width = 40;
        this.height = 40;
        this.x = width / 2 - this.width / 2;
        this.y = height - 70;
        this.shieldActive = false;
        this.shieldTimer = 0;

        // 武器型態
        this.weaponType = 'WIDE'; 
        this.wideRows = 2;        // 【無限加寬】：初始 2 排，吃到 🔷 每次 +2
        this.spreadLevel = 1;     // 扇形等級 (1~3)
      }

      update() {
        if (keys.left && this.x > 0) this.x -= CONFIG.PLAYER_SPEED;
        if (keys.right && this.x < width - this.width) this.x += CONFIG.PLAYER_SPEED;

        if (touchX !== null) {
          const targetX = touchX - this.width / 2;
          this.x += (targetX - this.x) * 0.2;
          if (this.x < 0) this.x = 0;
          if (this.x > width - this.width) this.x = width - this.width;
        }

        if (this.shieldActive) {
          this.shieldTimer--;
          if (this.shieldTimer <= 0) this.shieldActive = false;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(16, 0, 8, 36);
        ctx.fillRect(8, 16, 24, 12);

        ctx.fillStyle = '#FF0033';
        ctx.fillRect(0, 20, 8, 16);
        ctx.fillRect(32, 20, 8, 16);
        ctx.fillRect(16, 8, 8, 6);

        if (this.shieldActive) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(20, 20, 30 + Math.sin(Date.now() / 100) * 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
          ctx.fill();
        }

        ctx.restore();
      }
    }

    class Enemy {
      constructor(x, y, type) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.type = type;
        this.width = type === 'BOSS' ? 60 : 36;
        this.height = type === 'BOSS' ? 60 : 36;
        this.hp = type === 'BOSS' ? 30 + wave * 8 : 1; // 稍微增強 Boss 扛得住彈幕
        this.maxHp = this.hp;
        this.isDiving = false;
        this.diveAngle = 0;
        this.diveSpeed = CONFIG.ENEMY_DIVE_SPEED;
        this.swingOffset = Math.random() * Math.PI * 2;
      }

      update(formationTime) {
        if (!this.isDiving) {
          const swing = Math.sin(formationTime * 0.003 + this.swingOffset) * 40;
          this.x = this.startX + swing;
          this.y = this.startY + Math.sin(formationTime * 0.002) * 10;

          if (Math.random() < 0.0008 * wave && this.type !== 'BOSS') {
            this.isDiving = true;
          }
        } else {
          this.y += this.diveSpeed;
          this.x += Math.sin(this.diveAngle) * 3;
          this.diveAngle += 0.05;

          if (this.y > height) {
            this.y = -50;
            this.isDiving = false;
          }
        }

        if (Math.random() < CONFIG.ENEMY_FIRE_CHANCE && this.y > 0 && this.y < height - 100) {
          enemyBullets.push(new Bullet(this.x + this.width / 2, this.y + this.height, 4, '#ff3300', true));
        }
      }

      draw() {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (this.type === 'BOSS') {
          ctx.font = CONFIG.EMOJIS.BOSS_SIZE;
          ctx.shadowColor = this.hp < this.maxHp * 0.5 ? '#ff0000' : '#aa00ff';
          ctx.shadowBlur = 15 + Math.sin(Date.now() / 150) * 10;
          ctx.fillText(CONFIG.EMOJIS.BOSS, this.x + this.width / 2, this.y + this.height / 2);

          ctx.shadowBlur = 0;
          const barWidth = 60;
          const barHeight = 6;
          const healthRatio = this.hp / this.maxHp;
          ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
          ctx.fillRect(this.x + (this.width - barWidth) / 2, this.y - 14, barWidth, barHeight);
          ctx.fillStyle = '#00ffcc';
          ctx.fillRect(this.x + (this.width - barWidth) / 2, this.y - 14, barWidth * healthRatio, barHeight);
        } else {
          ctx.font = '28px sans-serif';
          const emoji = this.type === 'RED' ? CONFIG.EMOJIS.ENEMY_RED : CONFIG.EMOJIS.ENEMY_GREEN;
          ctx.fillText(emoji, this.x + this.width / 2, this.y + this.height / 2);
        }

        ctx.restore();
      }
    }

    class Bullet {
      constructor(x, y, speed, color, isEnemy = false, vx = 0) {
        this.x = x;
        this.y = y;
        this.speed = speed;
        this.color = color;
        this.isEnemy = isEnemy;
        this.vx = vx;
        this.width = 4;
        this.height = 12;
      }
      update() {
        this.x += this.vx;
        if (this.isEnemy) {
          this.y += this.speed;
        } else {
          this.y -= this.speed;
        }
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
        ctx.shadowBlur = 0;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
        this.size = Math.random() * 4 + 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.02;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1;
      }
    }

    class PowerUp {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.speed = 2;
      }
      update() {
        this.y += this.speed;
      }
      draw() {
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let icon = CONFIG.EMOJIS.SHIELD_ITEM;
        if (this.type === 'WEAPON_SPREAD') icon = CONFIG.EMOJIS.WEAPON_SPREAD;
        if (this.type === 'WEAPON_WIDE') icon = CONFIG.EMOJIS.WEAPON_WIDE;
        ctx.fillText(icon, this.x, this.y);
      }
    }

    function createWave(waveNum) {
      enemies = [];
      const centerX = width / 2;

      if (waveNum % 3 === 0) {
        enemies.push(new Enemy(centerX - 30, 100, 'BOSS'));
        return;
      }

      if (waveNum % 3 === 1) {
        const heartCoords = [
          { r: 0, c: 0 },
          { r: -1, c: -1 }, { r: -1, c: 1 },
          { r: -2, c: -2 }, { r: -2, c: 2 },
          { r: -3, c: -2.5 }, { r: -3, c: -1 }, { r: -3, c: 1 }, { r: -3, c: 2.5 },
          { r: -4, c: -1.8 }, { r: -4, c: 1.8 }
        ];

        heartCoords.forEach(pt => {
          const x = centerX + pt.c * 45 - 18;
          const y = 220 + pt.r * 40;
          enemies.push(new Enemy(x, y, 'GREEN'));
        });
      } else {
        const rows = 5;
        const cols = 7;
        const spacingX = 45;
        const spacingY = 35;
        const startX = centerX - (cols * spacingX) / 2;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = startX + c * spacingX;
            const y = 80 + r * spacingY;
            const type = r < 2 ? 'RED' : 'GREEN';
            enemies.push(new Enemy(x, y, type));
          }
        }
      }
    }

    function createExplosion(x, y, color = '#ffcc00', count = 15) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    // =========================================================================
    // 【核心】自動發射邏輯：支援無上限平行加寬
    // =========================================================================
    function handleAutoFire(now) {
      if (now - lastShootTime > CONFIG.AUTO_FIRE_RATE) {
        const spd = CONFIG.BULLET_SPEED;
        const centerX = player.x + player.width / 2;
        const topY = player.y;

        // ----------------------------------------------------
        // 型態一：扇型散射 (SPREAD)
        // ----------------------------------------------------
        if (player.weaponType === 'SPREAD') {
          if (player.spreadLevel === 1) {
            playerBullets.push(new Bullet(centerX, topY, spd, '#ffff00', false, 0));
            playerBullets.push(new Bullet(centerX - 10, topY, spd, '#ffff00', false, -1.8));
            playerBullets.push(new Bullet(centerX + 10, topY, spd, '#ffff00', false, 1.8));
          } else if (player.spreadLevel === 2) {
            const vxs = [-3, -1.5, 0, 1.5, 3];
            vxs.forEach(vx => playerBullets.push(new Bullet(centerX, topY, spd, '#ff9900', false, vx)));
          } else {
            const vxs = [-4.5, -3, -1.5, 0, 1.5, 3, 4.5];
            vxs.forEach(vx => playerBullets.push(new Bullet(centerX, topY, spd, '#ff3300', false, vx)));
          }
        } 
        // ----------------------------------------------------
        // 型態二：平行加寬 (WIDE) - 2 / 4 / 6 / 8 / 10 / 12... 無限加排！
        // ----------------------------------------------------
        else if (player.weaponType === 'WIDE') {
          const rows = player.wideRows;
          const spacing = 12; // 每排子彈橫向間距 (px)
          const totalWidth = (rows - 1) * spacing;
          const startX = centerX - totalWidth / 2; // 對稱中心點向兩側鋪排

          // 彈幕顏色根據排數演進，越高排越酷炫！
          let bulletColor = '#00e5ff'; // 2~4 排：青藍色
          if (rows >= 6 && rows < 10) bulletColor = '#00ffaa'; // 6~8 排：霓虹綠
          if (rows >= 10 && rows < 16) bulletColor = '#ff00ff'; // 10~14 排：紫光
          if (rows >= 16) bulletColor = '#ffff00'; // 16 排以上：金光神域

          for (let i = 0; i < rows; i++) {
            const bulletX = startX + i * spacing;
            playerBullets.push(new Bullet(bulletX, topY, spd, bulletColor, false, 0));
          }
        }

        lastShootTime = now;
      }
    }

    function initGame() {
      score = 0;
      lives = CONFIG.INITIAL_LIVES;
      wave = 1;
      playerBullets = [];
      enemyBullets = [];
      particles = [];
      powerups = [];

      stars = [];
      for (let i = 0; i < 80; i++) stars.push(new Star());

      player = new Player();
      createWave(wave);
    }

    function update(now) {
      if (gameState !== 'PLAYING') return;

      stars.forEach(s => s.update());
      player.update();

      if (keys.left || keys.right || touchX !== null) {
        handleAutoFire(now);
      }

      // 玩家子彈 (超寬彈幕支援擴大邊界移除範圍)
      playerBullets.forEach((b, index) => {
        b.update();
        if (b.y < -20 || b.x < -100 || b.x > width + 100) {
          playerBullets.splice(index, 1);
        }
      });

      // 敵人子彈
      enemyBullets.forEach((b, index) => {
        b.update();
        if (b.y > height + 20) enemyBullets.splice(index, 1);

        if (
          b.x > player.x &&
          b.x < player.x + player.width &&
          b.y > player.y &&
          b.y < player.y + player.height
        ) {
          enemyBullets.splice(index, 1);
          if (!player.shieldActive) {
            lives--;
            createExplosion(player.x + 20, player.y + 20, '#ff0000', 25);
            if (lives <= 0) gameOver();
          } else {
            createExplosion(b.x, b.y, '#00ffff', 5);
          }
        }
      });

      // 敵人與子彈碰撞
      enemies.forEach((enemy, eIndex) => {
        enemy.update(now);

        playerBullets.forEach((b, bIndex) => {
          if (
            b.x > enemy.x &&
            b.x < enemy.x + enemy.width &&
            b.y > enemy.y &&
            b.y < enemy.y + enemy.height
          ) {
            playerBullets.splice(bIndex, 1);
            enemy.hp--;
            createExplosion(b.x, b.y, '#ffff00', 4);

            if (enemy.hp <= 0) {
              createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff6600', 20);

              // 掉落機率稍微提高，方便快速體驗無限加排！
              const rand = Math.random();
              if (rand < 0.08) {
                powerups.push(new PowerUp(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 'SHIELD'));
              } else if (rand < 0.22) {
                powerups.push(new PowerUp(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 'WEAPON_SPREAD'));
              } else if (rand < 0.38) {
                powerups.push(new PowerUp(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 'WEAPON_WIDE'));
              }

              score += enemy.type === 'BOSS' ? 500 : (enemy.type === 'RED' ? 100 : 50);
              enemies.splice(eIndex, 1);
            }
          }
        });

        if (
          enemy.x < player.x + player.width &&
          enemy.x + enemy.width > player.x &&
          enemy.y < player.y + player.height &&
          enemy.y + enemy.height > player.y
        ) {
          if (!player.shieldActive) {
            lives--;
            createExplosion(player.x + 20, player.y + 20, '#ff0000', 30);
            if (enemy.type !== 'BOSS') enemies.splice(eIndex, 1);
            if (lives <= 0) gameOver();
          }
        }
      });

      // 【撿拾道具】：無限加寬核心判定
      powerups.forEach((p, index) => {
        p.update();
        if (p.y > height + 30) powerups.splice(index, 1);

        if (
          Math.abs(p.x - (player.x + player.width / 2)) < 30 &&
          Math.abs(p.y - (player.y + player.height / 2)) < 30
        ) {
          if (p.type === 'SHIELD') {
            player.shieldActive = true;
            player.shieldTimer = 300;
            createExplosion(player.x + 20, player.y + 20, '#00ffff', 10);
          } 
          else if (p.type === 'WEAPON_SPREAD') {
            if (player.weaponType === 'SPREAD') {
              if (player.spreadLevel < 3) player.spreadLevel++;
            } else {
              player.weaponType = 'SPREAD';
            }
            createExplosion(player.x + 20, player.y + 20, '#ffff00', 12);
          } 
          // 吃到 🔷：如果已經是加寬型，排數直接 +2，永無上限！
          else if (p.type === 'WEAPON_WIDE') {
            if (player.weaponType === 'WIDE') {
              player.wideRows += 2; // 2 -> 4 -> 6 -> 8 -> 10 -> 12...
            } else {
              player.weaponType = 'WIDE';
            }
            createExplosion(player.x + 20, player.y + 20, '#00e5ff', 15);
          }

          powerups.splice(index, 1);
        }
      });

      particles.forEach((p, index) => {
        p.update();
        if (p.alpha <= 0) particles.splice(index, 1);
      });

      if (enemies.length === 0) {
        wave++;
        createWave(wave);
      }
    }

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      stars.forEach(s => s.draw());

      if (gameState === 'PLAYING') {
        player.draw();
        enemies.forEach(e => e.draw());
        playerBullets.forEach(b => b.draw());
        enemyBullets.forEach(b => b.draw());
        powerups.forEach(p => p.draw());
        particles.forEach(p => p.draw());
        renderHUD();
      }
    }

    function renderHUD() {
      ctx.save();
      ctx.font = 'bold 18px "Courier New", monospace';
      
      ctx.fillStyle = '#00ffff';
      ctx.fillText(`SCORE: ${score}`, 20, 35);

      ctx.font = '14px "Courier New", monospace';
      if (player.weaponType === 'SPREAD') {
        ctx.fillStyle = '#ffff00';
        ctx.fillText(`WEAPON: [⚡ SPREAD 扇型] LV.${player.spreadLevel}`, 20, 58);
      } else {
        ctx.fillStyle = '#00e5ff';
        // 即時動態顯示當前排數
        ctx.fillText(`WEAPON: [🔷 WIDE 加寛] 💥 ${player.wideRows} 排密集光束`, 20, 58);
      }

      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#ffff00';
      ctx.textAlign = 'center';
      ctx.fillText(`WAVE ${wave}`, width / 2, 35);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff0055';
      let livesText = '';
      for (let i = 0; i < lives; i++) livesText += CONFIG.EMOJIS.LIVES_ICON;
      ctx.fillText(livesText, width - 20, 35);

      ctx.restore();
    }

    function loop(now) {
      update(now);
      render();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      overlayTitle.innerText = 'GAME OVER';
      overlayDesc.innerHTML = `最終得分: <b style="color:#ffff00">${score}</b><br>挑戰關卡: 第 ${wave} 波<br>最高加寬: <b style="color:#00e5ff">${player.wideRows} 排子彈</b>`;
      startBtn.innerText = '再次挑戰';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    window.addEventListener('touchstart', (e) => {
      if (gameState === 'PLAYING') touchX = e.touches[0].clientX;
    });

    window.addEventListener('touchmove', (e) => {
      if (gameState === 'PLAYING') touchX = e.touches[0].clientX;
    });

    window.addEventListener('touchend', () => { touchX = null; });

    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      initGame();
      gameState = 'PLAYING';
    });

    resizeCanvas();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
